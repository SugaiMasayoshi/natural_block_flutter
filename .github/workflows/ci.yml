name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: natural_block_flutter
    steps:
      - uses: actions/checkout@v5
        with:
          path: natural_block_flutter
      # natural_block is not on pub.dev yet, so it is read from its repository.
      - uses: actions/checkout@v5
        with:
          repository: SugaiMasayoshi/natural_block
          path: natural_block
      - run: |
          printf 'dependency_overrides:\n  natural_block:\n    path: ../natural_block\n' > pubspec_overrides.yaml
          printf 'dependency_overrides:\n  natural_block:\n    path: ../../natural_block\n' > example/pubspec_overrides.yaml
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter analyze --fatal-infos
        working-directory: natural_block_flutter/example
      - run: flutter test
        working-directory: natural_block_flutter/example
