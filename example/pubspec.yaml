name: example
description: "Demo app for the natural_block_flutter package: a live playground plus a gallery of rendered markup samples."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  natural_block_flutter:
    path: ../

  # Needed to name AST node types (TextNode, ...) when registering a custom
  # NodeBuilder. Any consumer doing the same needs this dependency too.
  natural_block:
    path: ../../natural_block

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
